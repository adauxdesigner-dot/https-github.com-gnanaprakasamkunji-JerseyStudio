name: "Release JerseyStudio Desktop App"

# This workflow builds and packages official production installers for macOS (.dmg / .app)
# and Windows (.exe NSIS / .msi) whenever a release tag is created or manually triggered.
# Designed for 1-click execution with ZERO technical setup required for the founder.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Version (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Build ${{ matrix.platform }} Installer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            bundle_ext: 'dmg'
            output_name: 'JerseyStudio-macOS.dmg'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            bundle_ext: 'exe'
            output_name: 'JerseyStudio-Windows-Setup.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust dependencies on Linux / Windows
        if: runner.os == 'Windows'
        run: |
          rustup target add x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Run Frontend & Type Checks
        run: npm run typecheck

      - name: Build Web Application
        run: npm run build

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.release_tag }}
          releaseName: 'JerseyStudio ${{ github.ref_name || inputs.release_tag }}'
          releaseBody: |
            ### JerseyStudio Production Release ${{ github.ref_name || inputs.release_tag }}
            
            **Local-first Athletic Jersey Design & Bulk Personalization Studio**
            
            - 🔒 **100% Privacy Boundary**: Zero designs, rosters, or exports leave your computer.
            - ⚡ **7-Day Offline Grace Window**: Work completely offline with local SQLite storage.
            - 👕 **100-Record Bulk Queue**: Instant vector jersey rendering and ZIP export.
            
            #### Downloads:
            - **macOS (Intel & Apple Silicon)**: `JerseyStudio_${{ github.ref_name || inputs.release_tag }}_x64.dmg`
            - **Windows (10 / 11)**: `JerseyStudio_${{ github.ref_name || inputs.release_tag }}_x64-setup.exe`
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jerseystudio-${{ matrix.platform }}-installer
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn
